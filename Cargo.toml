[package]
name = "rsdup"
version = "0.1.0"
edition = "2024"
description = "A syntax-aware code duplication finder for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mre/rsdup"
keywords = ["duplication", "clone-detection", "rust", "lint"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.99"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy"] }
blake3 = "1.8.2"
clap = { version = "4.5.46", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
fastembed = { version = "=7.0.1", default-features = false, features = ["ort-download-binaries-native-tls"] }
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq", "native-tls"] }
ignore = "0.4.23"
# Keep the ONNX Runtime binding aligned with the recorded inference provenance.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
ra_ap_syntax = "=0.0.350"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28", "layout-cache"] }
ratatui-themes = { version = "0.3.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
# Preserve embedding values exactly across persistent result-cache reads.
serde_json = { version = "1.0.143", features = ["float_roundtrip"] }
sha2 = "0.10"
shlex = "1.3"
tempfile = "3.21.0"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
ureq = { version = "3", default-features = false, features = ["json"] }
# ra-ap-rustc_lexer 0.166.0 requires matching Unicode tables. Keep both on
# Unicode 17 even when cargo install resolves dependencies without --locked.
unicode-ident = "=1.0.24"
unicode-properties = "=0.1.4"
